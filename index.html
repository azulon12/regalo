<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta Virtual ❤️</title>

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffc0cb,#ffdce6);
  font-family:Arial, sans-serif;
  overflow:hidden;
}

.contenedor{
  text-align:center;
}

.sobre{
  position:relative;
  width:520px;
  height:340px;
  background:#ff8fab;
  border-radius:12px;
  cursor:pointer;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.tapa{
  position:absolute;
  width:100%;
  height:100%;
  background:#ff4f81;
  clip-path:polygon(0 0,50% 55%,100% 0);
  transform-origin:top;
  transition:1s ease;
  z-index:3;
}

.carta{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  bottom:10px;
  background:white;
  border-radius:15px;
  padding:20px;
  box-sizing:border-box;
  transform:translateY(120%);
  transition:1s ease;
  z-index:2;
  overflow:auto;
}

.carta h1{
  color:#ff4f81;
  margin-bottom:10px;
}

.carta p{
  color:#555;
  font-size:18px;
  line-height:1.6;
}

.carta img{
  width:100%;
  border-radius:15px;
  margin-top:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.abierto .tapa{
  transform:rotateX(180deg);
}

.abierto .carta{
  transform:translateY(0);
}

.texto{
  margin-top:18px;
  color:white;
  font-size:22px;
}

</style>
</head>

<body>

<div class="contenedor">

<div class="sobre" id="sobre" onclick="abrirCarta()">

<div class="tapa"></div>

<div class="carta">

<h1>Para Ti ❤️</h1>

<p>
Aquí puedes escribir el mensaje que quieras ✨
</p>

<!-- CAMBIA "foto.jpg" POR EL NOMBRE DE TU FOTO -->
<img src="foto.jpg.jpg">

<p>
Gracias por estar conmigo 💖
</p>

</div>

</div>

<div class="texto">
Haz clic en la carta 💌
</div>

</div>

<!-- MÚSICA -->
<audio id="musica">
  <source src="música.mp3.mp3" type="audio/mpeg">
</audio>

<script>

function abrirCarta(){

  document.getElementById("sobre")
  .classList.toggle("abierto");

  const musica =
  document.getElementById("musica");

  musica.play();
}

</script>

</body>
</html>
